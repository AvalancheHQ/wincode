name: CodSpeed

on:
  push:
    branches: [master]
  pull_request:
  # allows CodSpeed to trigger backtest performance analysis
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: benchmarks (simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.89.0
          # `target-cpu=native` from .cargo/config.toml would make the measured
          # code depend on the runner's CPU, so build without extra rustflags
          rustflags: ""
          cache-target: release
      - name: install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked
      - name: build benchmarks
        run: cargo codspeed build -p wincode --features derive
      - name: run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: cargo codspeed run
